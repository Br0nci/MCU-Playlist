        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            color: #e0e0e0;
            padding: 12px;
            line-height: 1.4;
            min-height: 100vh;
        }
        
        .password-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .password-modal.hidden {
            display: none;
        }
        
        .password-box {
            text-align: center;
            max-width: 320px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #e50914;
            border-radius: 12px;
            padding: 32px 24px;
            backdrop-filter: blur(10px);
        }
        
        .password-box h1 {
            font-size: 48px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        
        .password-box p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        .password-input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 12px;
            transition: border 0.2s;
        }
        
        .password-input-group input:focus {
            outline: none;
            border-color: #e50914;
        }
        
        .password-input-group button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e50914, #cc0810);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        
        .password-input-group button:hover {
            transform: scale(1.02);
        }
        
        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }
        
        .error.show {
            display: block;
        }
        
        .app {
            display: none;
        }
        
        .app.show {
            display: block;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e50914;
        }
        
        h2 {
            font-size: 28px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        
        .subtitle {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .mode-btn {
            padding: 11px 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .mode-btn:hover {
            border-color: #e50914;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #e50914, #cc0810);
            border-color: #e50914;
            color: white;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }
        
        .progress {
            margin-bottom: 20px;
            background: rgba(20, 20, 20, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e50914, #ff6b6b);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }
        
        .list {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .list::-webkit-scrollbar {
            width: 6px;
        }
        
        .list::-webkit-scrollbar-track {
            background: #111;
        }
        
        .list::-webkit-scrollbar-thumb {
            background: #e50914;
            border-radius: 3px;
        }
        
        .section {
            margin-bottom: 18px;
        }
        
        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 0;
            border-bottom: 2px solid #e50914;
            margin-bottom: 12px;
        }
        
        .item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(20, 20, 20, 0.6);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #222;
            align-items: flex-start;
            transition: all 0.2s;
        }
        
        .item:hover {
            background: rgba(30, 30, 30, 0.8);
            border-color: #e50914;
        }
        
        .item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 3px;
            accent-color: #e50914;
        }
        
        .item-poster {
            width: 50px;
            height: 72px;
            flex-shrink: 0;
            border-radius: 6px;
            background: linear-gradient(135deg, #e50914, #8b0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
        }
        
        .item-poster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.1) 10px,
                rgba(0,0,0,0.1) 20px
            );
        }
        
        .item-poster-icon {
            position: relative;
            z-index: 1;
        }
        
        .item-content {
            flex: 1;
            min-width: 0;
        }
        
        .item-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
            color: #e0e0e0;
        }
        
        .item-meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .item-reason {
            font-size: 10px;
            color: #888;
            font-style: italic;
        }
        
        .item.checked {
            opacity: 0.6;
        }
        
        .item.checked .item-title {
            text-decoration: line-through;
            color: #555;
        }

            display: inline-block;
            font-size: 9px;
            background: rgba(229, 9, 20, 0.2);
            color: #ff8a8a;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
            border: 1px solid rgba(229, 9, 20, 0.4);

            left: 0;
            right: 0;

            color: #888;

            transition: all 0.2s;

        .profile-info button:hover {
            background: #e50914;
            color: white;
            border-color: #e50914;
        }
    </style>
</head>

        let currentMode = 'complete';
        let currentProfile = localStorage.getItem('mcu-profile');
        let checked = {};
        
        function getProfileKey() {
            return `mcu-doomsday-${currentProfile}`;
        }
        
        function setProfile() {
            const input = document.getElementById('profileInput');
            const name = input.value.trim();
            
            if (!name) {
                alert('Voer alsjeblieft je naam in');
                return;
            }
            
            currentProfile = name;
            localStorage.setItem('mcu-profile', currentProfile);
            checked = JSON.parse(localStorage.getItem(getProfileKey()) || '{}');
            
            document.getElementById('profileModal').classList.remove('active');
            document.getElementById('profileInfo').style.display = 'flex';
            document.getElementById('profileName').textContent = currentProfile;
            
            render();
        }
        
        function changeProfile() {
            localStorage.removeItem('mcu-profile');
            currentProfile = null;
            checked = {};
            document.getElementById('profileModal').classList.add('active');
            document.getElementById('profileInfo').style.display = 'none';
            document.getElementById('profileInput').value = '';
        }
        
        function initProfile() {
            if (!currentProfile) {
                document.getElementById('profileModal').classList.add('active');
            } else {
                checked = JSON.parse(localStorage.getItem(getProfileKey()) || '{}');
                document.getElementById('profileInfo').style.display = 'flex';
                document.getElementById('profileName').textContent = currentProfile;
            }
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });
            
            document.getElementById('profileInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') setProfile();
            });
            
            render();
        }
        
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            render();
        }
        
        function toggleItem(num) {
            checked[num] = !checked[num];
            localStorage.setItem(getProfileKey(), JSON.stringify(checked));
            render();
        }
        
        function render() {
            const items = data[currentMode];
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            
            const grouped = {};
            items.forEach(item => {
                if (!grouped[item.section]) grouped[item.section] = [];
                grouped[item.section].push(item);
            });
            
            let totalChecked = 0;
            
            Object.keys(grouped).forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section';
                
                const titleEl = document.createElement('div');
                titleEl.className = 'section-title';
                titleEl.textContent = section;
                sectionEl.appendChild(titleEl);
                
                grouped[section].forEach(item => {
                    const isChecked = checked[item.num];
                    if (isChecked) totalChecked++;
                    
                    const itemEl = document.createElement('div');
                    itemEl.className = `item ${isChecked ? 'checked' : ''}`;
                    
                    const warning = item.warning ? `<span class="warning">${item.warning}</span>` : '';
                    const icon = posterIcons[item.num] || '🎬';
                    
                    itemEl.innerHTML = `
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleItem(${item.num})">
                        <div class="item-poster">
                            <span class="item-poster-icon">${icon}</span>
                        </div>
                        <div class="item-content">
                            <div class="item-title">${item.num}. ${item.title}</div>
                            <div class="item-meta">${item.year} • ${item.duration}</div>
                            <div class="item-reason">→ ${item.reason}${warning}</div>
                        </div>
                    `;
                    
                    sectionEl.appendChild(itemEl);
                });
                
                listEl.appendChild(sectionEl);
            });
            
            const total = items.length;
            const percent = Math.round((totalChecked / total) * 100);
            
            document.getElementById('progress-text').textContent = `${totalChecked}/${total}`;
            document.getElementById('progress-bar').style.width = percent + '%';
        }
    </script>
